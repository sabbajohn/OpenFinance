name: Platform CI
on:
  push:
    paths: ["platform/**", "packages/**", "docs/openapi/**", "deploy/**", "infra/**", "docker-compose.yml", ".dockerignore", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", "packages/**", "docs/openapi/**", "deploy/**", "infra/**", "docker-compose.yml", ".dockerignore", ".github/workflows/platform-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: mbstring, intl, pdo_sqlite }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: platform/package-lock.json }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test --compact
      - run: npm run lint:check && npm run format:check && npm run types:check && npm run build

  infrastructure:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform } }
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: openfinance
      DB_USERNAME: openfinance
      DB_PASSWORD: local-secret
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MINIO_ACCESS_KEY: openfinance
      MINIO_SECRET_KEY: local-minio-secret
      MINIO_RAW_BUCKET: openfinance-raw
      MINIO_ENDPOINT: http://127.0.0.1:9000
      RUN_INFRASTRUCTURE_TESTS: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfinance
          POSTGRES_USER: openfinance
          POSTGRES_PASSWORD: local-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfinance -d openfinance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: mbstring, intl, pdo_pgsql }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Start MinIO and create the raw payload bucket
        working-directory: .
        run: |
          docker run --detach --name openfinance-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=openfinance \
            --env MINIO_ROOT_PASSWORD=local-minio-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network container:openfinance-ci-minio \
            --entrypoint /bin/sh \
            --env MINIO_ROOT_USER=openfinance \
            --env MINIO_ROOT_PASSWORD=local-minio-secret \
            minio/mc:RELEASE.2025-07-21T05-28-08Z \
            -c 'mc alias set raw http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing raw/openfinance-raw'
      - run: php artisan migrate --force
      - run: php artisan test --compact tests/Feature/InfrastructureSmokeTest.php

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: for script in deploy/bin/*.sh; do sh -n "$script"; done
      - name: Validate development Compose
        run: |
          cp platform/.env.example platform/.env
          docker compose --profile monitoring config --quiet
      - name: Validate deploy Compose files
        run: |
          docker compose --env-file deploy/env/production.env.example -f deploy/docker-compose.production.yml --profile app --profile workers --profile scheduler --profile release config --quiet
          docker compose --env-file deploy/env/staging.env.example -f deploy/docker-compose.staging.yml --profile release config --quiet
          docker compose --env-file deploy/env/edge.env.example -f deploy/docker-compose.edge.yml config --quiet
          docker compose --env-file deploy/env/observability.env.example -f deploy/docker-compose.observability.yml config --quiet
      - name: Validate Nginx configuration
        run: docker run --rm --add-host app:127.0.0.1 -v "$PWD/platform/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, infrastructure, deployment-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: app
            target: app-runtime
          - component: web
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize image name
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.base }}/${{ matrix.component }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.base }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
