global
    log stdout format raw local0
    maxconn 20000
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option httpchk GET /up
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend public_http
    bind :80
    http-request redirect scheme https code 308

frontend public_https
    bind :443 ssl crt "${TLS_CERT_PATH}" alpn h2,http/1.1
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-For %[src] unless { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto https
    default_backend coolify_apps

backend coolify_apps
    balance leastconn
    option httpchk GET /up
    http-check expect status 200
    server app1 "${APP_NODE_1}" check inter 2s fall 3 rise 2
    server app2 "${APP_NODE_2}" check inter 2s fall 3 rise 2

frontend operations
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
