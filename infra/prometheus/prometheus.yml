global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: openfinance-platform
    metrics_path: /api/internal/metrics
    authorization:
      type: Bearer
      credentials: local-metrics-secret
    static_configs:
      - targets: ['web:80']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
