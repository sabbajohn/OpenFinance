global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: openfinance-platform
    metrics_path: /api/internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/openfinance_metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/openfinance.json]
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

